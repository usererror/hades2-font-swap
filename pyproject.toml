[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hades2-font-swap"
version = "1.0.0"
description = "Replace Hades II's in-game fonts with any TrueType or OpenType font."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "usererror" }]
requires-python = ">=3.10"
dependencies = [
    "fonttools>=4.40",
    "pillow>=10.1",
]
keywords = ["hades", "hades-ii", "supergiant", "modding", "fonts", "xnb"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Text Processing :: Fonts",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/usererror/hades2-font-swap"
Issues = "https://github.com/usererror/hades2-font-swap/issues"
Changelog = "https://github.com/usererror/hades2-font-swap/blob/main/CHANGELOG.md"

[project.scripts]
hades2-font-swap = "hades2_font_swap.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pyinstaller>=6.10",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "PL",       # pylint
    "PT",       # pytest style
    "RUF",      # ruff-specific
    "D",        # docstrings
]
ignore = [
    "PLR2004",  # magic values are clearer than constants for format offsets
    "PLR0913",  # CLI-style functions take many keyword arguments
    "D105", "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0915"]
"scripts/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["hades2_font_swap"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

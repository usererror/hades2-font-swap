name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check-version:
    name: Check tag matches pyproject version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare versions
        shell: bash
        run: |
          project=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$project" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version $project"
            exit 1
          fi

  python-package:
    name: Build wheel and sdist
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*

  executable:
    name: Build ${{ matrix.asset }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: hades2-font-swap-windows-x64.exe
            built: dist/hades2-font-swap.exe
          - os: ubuntu-latest
            asset: hades2-font-swap-linux-x64
            built: dist/hades2-font-swap
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/build_exe.py
      - run: uv run python scripts/smoke_test.py ${{ matrix.built }}
      - name: Rename for release
        shell: bash
        run: mkdir -p release && cp "${{ matrix.built }}" "release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: release/*

  publish:
    name: Create GitHub release
    needs: [python-package, executable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Write checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: artifacts/*
